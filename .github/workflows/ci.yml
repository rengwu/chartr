name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sh scripts/install-linux-deps.sh

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check release scripts
        run: python3 -B -m unittest discover -s scripts/tests -v

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}-${{ runner.arch }}
          cache-on-failure: true

      - uses: ./.github/actions/setup-herdr
        with:
          platform: ${{ matrix.os }}

      - name: Build and test
        run: cargo test --workspace --locked --no-fail-fast --timings

      - name: Build the build-time native module example
        run: cargo check --manifest-path examples/plugins/hello/Cargo.toml --locked

      - name: Save build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.os }}
          path: |
            target/cargo-timings/*.html
            vendor/herdr/.build/target/cargo-timings/*.html
          include-hidden-files: true
          retention-days: 14

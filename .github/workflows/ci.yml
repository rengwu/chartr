name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  arch-packaging:
    name: Arch and AUR packaging
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install package test dependencies
        run: |
          pacman -Syu --noconfirm --needed python git gtk3 webkit2gtk-4.1 libxcb \
            libxkbcommon-x11 fontconfig vulkan-icd-loader xdg-utils
      - uses: actions/checkout@v4
      - name: Test Arch packages and AUR publication
        run: |
          useradd --create-home builder
          work=$(mktemp -d)
          cp -a scripts packaging "$work/"
          chown -R builder:builder "$work"
          cd "$work"
          runuser -u builder -- python3 -B -m unittest discover -s scripts/tests -p 'test_aur*.py' -v

  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sh scripts/install-linux-deps.sh

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check release scripts
        run: python3 -B -m unittest discover -s scripts/tests -v

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}-${{ runner.arch }}
          cache-on-failure: true

      - uses: ./.github/actions/setup-herdr
        with:
          platform: ${{ matrix.os }}

      - name: Build and test
        run: cargo test --workspace --locked --no-fail-fast --timings

      - name: Test forwarded X11 input-method events
        if: runner.os == 'Linux'
        run: cargo test -p gpui_linux --lib xim_preserves_native_and_forwarded --locked

      - name: Build the build-time native module example
        run: cargo check --manifest-path examples/plugins/hello/Cargo.toml --locked

      - name: Test real terminal sessions
        run: cargo test -p chartr --test live_session --locked -- --ignored --nocapture --test-threads=1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test web plugin bridges and layouts
        run: node --test crates/chartr/tests/plugin_bridge.cjs plugins/wayfinder/tests/layout.test.mjs

      - name: Save build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.os }}
          path: |
            target/cargo-timings/*.html
            vendor/herdr/.build/target/cargo-timings/*.html
          include-hidden-files: true
          retention-days: 14

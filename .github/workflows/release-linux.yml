name: Linux release

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    # Default-branch builds keep the release cache warm for future tags.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref_name == github.event.repository.default_branch
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)
          test "$RELEASE_TAG" = "v$version"

      - name: Install Linux dependencies
        run: sh scripts/install-linux-deps.sh

      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.os }}-${{ runner.arch }}
          cache-on-failure: true

      - uses: ./.github/actions/setup-herdr
        with:
          platform: ${{ matrix.os }}

      - name: Compile release once
        run: cargo build --release --locked -p chartr --bin chartr --timings

      - name: Package tar.gz and deb
        run: scripts/package-linux.sh

      - name: Package and check Arch Linux
        if: matrix.arch == 'x86_64'
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            archlinux:base-devel bash scripts/package-arch.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: target/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Save build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-timings-${{ matrix.arch }}
          path: |
            target/cargo-timings/*.html
            vendor/herdr/.build/target/cargo-timings/*.html
          include-hidden-files: true
          retention-days: 14

  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: packages

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" packages/* --clobber

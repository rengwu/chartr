# Release pipeline (ADR 0011). A tag `vX.Y.Z` cuts a GitHub release with:
#
#   * the portable baseline artifact — the pure-Go, cgo-free binary that serves the
#     cockpit in a browser — built and checksummed by goreleaser for macOS,
#     Linux and Windows from a single cgo-free job (the `release` job below); and
#   * Linux desktop packages — AppImage, deb and rpm — built and smoke-tested on
#     both published architectures before the release is created; and
#   * best-effort native webview shells — and, on macOS, the `chartr.app` disk
#     image packaged from that shell (ADR 0016) — built in a separate matrix job
#     that is `continue-on-error` and depends on the release already being
#     published, so a shell or packaging failure attaches nothing and CANNOT fail
#     the supported release (the `shells` job below).
#
# Distribution is GitHub releases only: no `go install`, no Homebrew, no plugin
# marketplace (ADR 0011).
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # goreleaser and `gh release upload` create/attach release assets

jobs:
  # Gate the release on the Windows PTY smoke test: the supported artifact ships
  # for Windows, so its ConPTY path must round-trip before we cut a tag.
  windows-smoke:
    name: windows PTY smoke (ConPTY round-trip)
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: ConPTY round-trip smoke test
        run: go test -v -run TestConPTYRoundTrip ./internal/terminal

  # The Linux desktop app, and a gate rather than a best-effort lane (ADRs 0011
  # and 0019). It is here, before `release`, because a renderer failure can be
  # silent: a bundled WebKit that cannot spawn its helper processes still
  # starts, still binds, still serves the SPA over loopback, and still exits 0 —
  # it just renders an error page instead of the cockpit. Nothing short of
  # looking at the screen catches that, which is what scripts/smoke-appimage.sh
  # does, on a container with no webkit and no gtk installed at all.
  linux-desktop:
    name: linux AppImage + deb/rpm + smoke (${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # webkit2gtk-4.0 is gone from Ubuntu 24.04; `make webview` forwards
      # webview_go's pin onto 4.1 with a generated .pc.
      - name: Install WebKitGTK toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build embedded frontend
        run: make web

      - name: Package the AppImage
        run: make appimage WEBVIEW_VERSION=${GITHUB_REF_NAME#v}
        shell: bash

      # Native packages carry the same shell and frontend as the AppImage, but
      # leave WebKitGTK to apt/dnf so distro security updates own the renderer.
      - name: Package deb and rpm
        run: make linux-packages WEBVIEW_VERSION=${GITHUB_REF_NAME#v}
        shell: bash

      # The gate. A failure here fails the tag.
      - name: Smoke the AppImage on a host with no WebKit
        run: scripts/smoke-appimage.sh build/appimage/chartr_${GITHUB_REF_NAME#v}_linux_${{ matrix.goarch }}.AppImage
        shell: bash

      # Each native package is installed inside the distro family it targets,
      # then tested by screenshot. In particular, the rpm test proves that the
      # shell built on the Ubuntu runner is ABI-compatible with Fedora rather
      # than merely trusting their common WebKit soname.
      - name: Smoke the deb on Ubuntu 24.04
        run: scripts/smoke-native-package.sh deb build/packages/chartr_${GITHUB_REF_NAME#v}_linux_${{ matrix.goarch }}.deb ${GITHUB_REF_NAME#v}
        shell: bash

      - name: Smoke the rpm on Fedora 44
        run: scripts/smoke-native-package.sh rpm build/packages/chartr_${GITHUB_REF_NAME#v}_linux_${{ matrix.goarch }}.rpm ${GITHUB_REF_NAME#v}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-${{ matrix.goarch }}
          path: |
            build/appimage/*.AppImage
            build/appimage/*.AppImage.sha256
            build/packages/*.deb
            build/packages/*.deb.sha256
            build/packages/*.rpm
            build/packages/*.rpm.sha256
          if-no-files-found: error

  release:
    name: supported binaries (cgo-free)
    needs: [windows-smoke, linux-desktop]
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history + tags for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # goreleaser's `before` hook runs `make web`, but run it here too so a hook
      # change never silently ships a stale embed.
      - name: Build embedded frontend
        run: make web

      - name: Release supported binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Attach the Linux desktop artifacts the gate already built and proved. They
  # are uploaded after the release exists, like every other per-platform asset,
  # but unlike the `shells` job below this one this is NOT continue-on-error: the
  # artifacts are known
  # good by the time this runs, so a failure here is a real upload failure and
  # should be loud.
  attach-linux-desktop:
    name: attach Linux AppImages and native packages
    needs: [release, linux-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-desktop-*
          merge-multiple: true
          path: linux-desktop

      # The versioned files are the archival assets; the unversioned copies
      # beside them are what a link can name in advance, exactly as the macOS
      # .dmg does. `/releases/latest/download/<asset>` needs an exact filename,
      # so the README's download link is only a download link if some asset
      # carries a name that does not move release to release. The architecture
      # stays in that name, and each sidecar is regenerated so the checksum
      # matches the file an operator actually pulled.
      - name: Alias the newest Linux downloads per architecture
        shell: bash
        run: |
          set -e
          for arch in amd64 arm64; do
            for extension in AppImage deb rpm; do
              versioned=$(ls linux-desktop/chartr_*_linux_${arch}.${extension} 2>/dev/null | head -1) || true
              [ -n "$versioned" ] || continue
              alias="linux-desktop/chartr_linux_${arch}.${extension}"
              cp "$versioned" "$alias"
              ( cd linux-desktop && sha256sum "chartr_linux_${arch}.${extension}" > "chartr_linux_${arch}.${extension}.sha256" )
              echo "aliased $versioned as $alias"
            done
          done

      - name: Upload to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --repo, because this job deliberately does not check the tree out.
        run: gh release upload "${GITHUB_REF_NAME}" linux-desktop/* --clobber --repo "${{ github.repository }}"
        shell: bash

  # Best-effort tier (ADR 0011): the native webview shells. This whole job is
  # `continue-on-error`, and it `needs: release` — so the supported release is
  # already published and checksummed before a single shell is attempted. A
  # failing webview toolchain on any platform attaches nothing for that platform
  # and leaves the release untouched; where a shell builds, it is uploaded as an
  # extra asset. This is the structural guarantee that "a shell failure does not
  # fail the release."
  shells:
    name: best-effort webview shell (${{ matrix.os }})
    needs: release
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
          - os: windows-latest
            goos: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # macOS links the system WebKit; Windows uses cgo-free go-webview2 (the
      # WebView2 runtime ships with the OS), so neither needs a toolchain step.
      # Linux is deliberately absent from this matrix: its desktop app is the
      # AppImage, which is built and smoke-tested as a *gate* above rather than
      # attached best-effort here.
      - name: Build embedded frontend
        run: make web

      # The stamp is the released tag, matching the supported binary exactly
      # (ADR 0013). `make webview` also writes the per-asset .sha256 sidecar —
      # the supported release owns checksums.txt and is never mutated here.
      - name: Build native webview shell
        id: build_shell
        run: make webview GOOS=${{ matrix.goos }} WEBVIEW_VERSION=${GITHUB_REF_NAME#v}
        shell: bash

      # macOS only: the same shell, packaged as `chartr.app` inside a `.dmg`
      # (ADR 0016). `make dmg` re-runs `make bundle` → `make webview` with the same
      # stamp, so the app carries exactly the executable the step above built. This
      # runs INSIDE this continue-on-error job, which already `needs` the published
      # release — so packaging cannot fail or alter the supported release, and a
      # packaging failure attaches nothing at all. That is the tiering guarantee;
      # do not lift this into its own job or make it gating.
      # The versioned image is the archival asset; the unversioned copy beside it
      # is the one a link can name in advance. `/releases/latest/download/<asset>`
      # needs an exact filename, so the README's download link is only a download
      # link if some asset carries a name that does not move release to release.
      # The architecture stays in that name — a second slice gets its own alias
      # rather than overwriting this one — and the sidecar is regenerated so the
      # checksum it lists matches the file the operator actually pulled.
      - name: Package the macOS app bundle and disk image
        if: matrix.goos == 'darwin' && steps.build_shell.outcome == 'success'
        shell: bash
        run: |
          set -e
          make dmg WEBVIEW_VERSION=${GITHUB_REF_NAME#v}
          goarch=$(go env GOARCH)
          versioned="build/macapp/chartr_${GITHUB_REF_NAME#v}_darwin_${goarch}.dmg"
          alias="chartr_darwin_${goarch}.dmg"
          cp "$versioned" "build/macapp/$alias"
          ( cd build/macapp && shasum -a 256 "$alias" > "$alias.sha256" )
          echo "aliased $versioned as $alias"

      # Upload only if the target actually produced a shell binary. `make webview`
      # exits 0 with no output when the host cannot build the shell (the tier is
      # genuinely optional), so a missing artifact is not an error here. The macOS
      # disk image and its per-asset sidecar ride along the same way; the supported
      # `checksums.txt` is never touched.
      - name: Attach shell to the release
        if: steps.build_shell.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(build/shell/* build/macapp/*.dmg build/macapp/*.dmg.sha256)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no webview shell built for ${{ matrix.goos }} — best-effort tier, nothing to attach"
            exit 0
          fi
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber

[package]
name = "chartr-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
ui = ["dep:ui"]

[dependencies]
# The framework, never the platform backend. A plugin that linked
# `gpui_platform` would register a second application with the window server.
gpui.workspace = true
ui = { workspace = true, optional = true }
serde.workspace = true
toml.workspace = true

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

[package]
name = "chartr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "chartr"

[features]
# Enables a loopback-only integration-test fixture; absent from normal builds.
companion-test-host = []

[dependencies]
chartr-companion = { path = "../chartr-companion" }
chartr-herdr = { path = "../chartr-herdr" }
chartr-plugin = { path = "../chartr-plugin" }
chartr-plugin-host = { path = "../chartr-plugin-host" }
gpui.workspace = true
# The one crate that may name the platform backend.
gpui_platform.workspace = true
ui.workspace = true
theme.workspace = true
zed_assets.workspace = true
terminal.workspace = true
terminal_view.workspace = true
editor.workspace = true
pulldown-cmark.workspace = true
settings.workspace = true
task.workspace = true
collections.workspace = true
util.workspace = true

anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tempfile.workspace = true
rusqlite.workspace = true
url.workspace = true
percent-encoding.workspace = true
ureq.workspace = true
rustix.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
wry.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

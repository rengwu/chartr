# A build-time native chartr module: one trait and one manifest.
#
# Deliberately not a member of chartr's workspace so its small contract can be
# checked independently. It is not linked into the shipped chartr application.
[workspace]

[package]
name = "hello"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[dependencies]
chartr-plugin = { path = "../../../crates/chartr-plugin" }

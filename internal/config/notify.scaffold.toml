# Session notifications are machine-wide server behaviour, so they live here
# rather than in terminal.toml (terminal customization) or user.toml (execution
# choices). This file is local to this machine, never committed and never scoped
# to a space.
#
# A provider-backed session turn must remain open for at least this long to report
# its semantic completion. A harness whose transcript cannot be bound falls back
# to the older `working` duration rule.
# after = "60s"
#
# A positive blocked state must last this long before reporting that the session
# needs you. The same delay settles working/idle completion only for fallback
# harnesses; a provider-recorded turn completion fires without this delay.
# settle = "10s"
#
# Turning this off removes the clock at its source: no finished event is produced.
# enabled = true

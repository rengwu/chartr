# opencode 1.2.27. Measured on this machine (ticket 04, see
# .plan/maps/agent-state-detection/assets/rec-opencode-1.2.27.jsonl: idle at the
# splash prompt, the "△ Permission required" panel it stopped on, and a working
# turn once approved).
#
# The title carries no state — two writes for a whole session, "OpenCode" at boot
# and then "OC | <session summary>" once the turn is named, which then never
# changes again. So opencode reads its whole grammar off the screen, exactly as
# kimi does.
#
# The correction ticket 04 exists for: the working rule here was extrapolated from
# the braille spinner claude and kimi share, and opencode does not use braille. Its
# spinner is a run of eight square cells that fill left to right, U+2B1D (⬝) and
# U+25A0 (■), immediately followed by the "esc interrupt" affordance. The old
# braille pattern could never have matched a single frame, so a working opencode
# read as idle for the same reason codex did.
agent = "opencode"
match = ["opencode"]

# Blocked: the "△ Permission required" panel. The footer row is the structural
# anchor — the three choices sit on one line, which is why it is a line_regex and
# not three substrings that could match scattered across the region. opencode draws
# no flat U+2500 rules (its chrome is ┃ and ▀), so the framed-region helpers claude
# and kimi use find nothing here and the panel is scoped by position instead: the
# footer is the second-from-last non-empty line while the panel is up.
[[rule]]
id = "blocked"
state = "blocked"
priority = 200
region = "bottom_non_empty_lines(4)"
line_regex = ['Allow once\s+Allow always\s+Reject']

# Working: the square-cell spinner leading the bottom status line, with "esc
# interrupt" behind it. Both halves are required — the glyph run alone is a
# progress-bar shape common enough to appear in output, and "esc interrupt" is the
# affordance opencode only offers while a turn can still be interrupted. It is gone
# from the line the moment the turn ends, which is what leaves idle an absence.
[[rule]]
id = "working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(4)"
line_regex = ['^\s*[\x{2B1D}\x{25A0}]+\s+esc interrupt']

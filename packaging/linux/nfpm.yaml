# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json

# The native Linux packages deliberately contain no GTK or WebKit libraries.
# They are the distro-integrated counterpart to the self-contained AppImage:
# apt/dnf owns the renderer, keeps it patched, and removes it when nothing else
# needs it. Environment variables are supplied by `make linux-packages`.
name: chartr
arch: ${PACKAGE_ARCH}
platform: linux
version: ${PACKAGE_VERSION}
version_schema: semver
section: devel
priority: optional
maintainer: John Goh <johngohrw@gmail.com>
description: |-
  AI workspace with a map of your work.
  chartr is an approachable agent multiplexer for running CLI agents and
  commands in tabbed terminal sessions, grouped into project spaces.
vendor: chartr
homepage: https://github.com/rengwu/chartr
license: MIT

contents:
  - src: ${PACKAGE_BINARY}
    dst: /usr/bin/chartr
    expand: true
    file_info:
      mode: 0755
  - src: packaging/linux/chartr.desktop
    dst: /usr/share/applications/io.github.rengwu.chartr.desktop
    file_info:
      mode: 0644
  - src: packaging/linux/io.github.rengwu.chartr.metainfo.xml
    dst: /usr/share/metainfo/io.github.rengwu.chartr.metainfo.xml
    file_info:
      mode: 0644
  # The icon theme spec allows SVG inside the fixed-size directories, so each
  # band ships as the master it was drawn for and the desktop rasterises at
  # whatever size it actually wants. A single 512 PNG used to cover every band,
  # which left every taskbar box-filtering 512 down to 22, 24 or 32 -- the sizes
  # a desktop actually draws -- and the strokes never landed on the pixel grid.
  #
  # These are the v4 masters the macOS iconset already feeds from
  # (docs/assets/v4), so both platforms draw the same artwork and cannot drift.
  # They render square and full-bleed, which is what a Linux desktop wants: it
  # masks, rounds and themes the icon itself (ADR 0016). Apple's pre-inset,
  # pre-shadowed squircle set is deliberately NOT what ships here.
  - src: docs/assets/v4/logo-app-16.svg
    dst: /usr/share/icons/hicolor/16x16/apps/chartr.svg
    file_info:
      mode: 0644
  - src: docs/assets/v4/logo-app-32.svg
    dst: /usr/share/icons/hicolor/32x32/apps/chartr.svg
    file_info:
      mode: 0644
  - src: docs/assets/v4/logo-app.svg
    dst: /usr/share/icons/hicolor/scalable/apps/chartr.svg
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/chartr/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/chartr/LICENSE
    packager: rpm
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/chartr/README.md
    file_info:
      mode: 0644

# WebKitGTK already pulls GTK3 and the renderer's complete runtime closure on
# both package families. The names differ, so only the dependency list needs an
# override; the payload stays byte-for-byte identical.
overrides:
  deb:
    depends:
      - libc6 (>= 2.39)
      - libwebkit2gtk-4.1-0
  rpm:
    depends:
      - glibc >= 2.39
      - webkit2gtk4.1

deb:
  compression: xz
  fields:
    Bugs: https://github.com/rengwu/chartr/issues

rpm:
  compression: zstd
  group: Development/Tools
  summary: AI workspace with a map of your work
  packager: John Goh <johngohrw@gmail.com>

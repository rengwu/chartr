<!doctype html>
<meta charset="utf-8" />
<title>Clock settings</title>
<style>
  :root { color-scheme: dark light; font: 14px system-ui, sans-serif; }
  body { margin: 0; padding: 20px; background: transparent; color: CanvasText; }
  label { display: grid; gap: 8px; max-width: 320px; }
  select { font: inherit; padding: 6px 8px; }
  #status { margin-top: 12px; opacity: .7; }
</style>
<label>
  Clock format
  <select id="format">
    <option value="24">24-hour</option>
    <option value="12">12-hour</option>
  </select>
</label>
<p id="status">Loading…</p>
<script>
  const format = document.querySelector("#format");
  const status = document.querySelector("#status");
  window.chartr.invoke("data.read", { path: "settings.json" })
    .then(text => { format.value = JSON.parse(text).format ?? "24"; })
    .catch(() => {})
    .finally(() => { status.textContent = "Changes are saved for this plugin."; });
  format.addEventListener("change", async () => {
    await window.chartr.invoke("data.write", {
      path: "settings.json",
      data: JSON.stringify({ format: format.value })
    });
    status.textContent = "Saved.";
  });
</script>

manifest_version = 2
id = "com.example.hello"
name = "Hello"
version = "0.1.0"
kind = "native"
# The Cargo library stem. zeddy appends this platform's extension, so one
# manifest covers .dylib, .so, and .dll.
library = "hello"
# Must equal zeddy's own. Rust and GPUI objects cross the library boundary, so
# there is no compatibility range and a mismatch is refused at load.
native_abi = 2

[capabilities]
multiplicity = "per_space"
restorable = true

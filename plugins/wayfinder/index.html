<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wayfinder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app">
      <div id="map" hidden></div>
      <section id="picker" aria-label="Choose a map">
        <header class="picker-heading">
          <h1>Maps</h1>
        </header>
        <div id="map-grid"></div>
      </section>
      <header class="toolbar" hidden>
        <button id="back" title="Back to all maps">
          <svg class="icon" aria-hidden="true">
            <use href="icons/ui.svg#ArrowLeft02Icon"></use>
          </svg>
          <span>Back</span>
        </button>
        <button
          id="overview"
          aria-pressed="false"
          title="Open map material — destination, notes, decisions, fog"
        >
          <span id="map-title"></span>
        </button>
      </header>
      <div id="notice" role="status" hidden>
        <span></span
        ><button class="icon-button" aria-label="Dismiss message">
          <svg class="icon" aria-hidden="true">
            <use href="icons/ui.svg#Cancel01Icon"></use>
          </svg>
        </button>
      </div>
      <section id="empty" hidden>
        <svg class="icon empty-star" aria-hidden="true">
          <use href="icons/ui.svg#Orbit01Icon"></use>
        </svg>
        <h1>No maps found</h1>
        <p id="empty-copy">
          Use the wayfinder skill to chart a map in .plan/maps/ following this
          plugin's TRACKER-CONVENTION.md.
        </p>
      </section>
      <aside id="detail" aria-label="Map and ticket details" hidden>
        <div
          id="detail-resize"
          role="separator"
          tabindex="0"
          aria-label="Resize the detail pane"
          aria-orientation="vertical"
          aria-controls="detail"
        ></div>
        <header class="detail-header">
          <div class="identity">
            <span id="ticket-number" class="coin"></span>
            <h1 id="detail-title"></h1>
            <button
              id="close-detail"
              class="icon-button text-button"
              title="Close details (Escape)"
              aria-label="Close details"
            >
              <svg class="icon" aria-hidden="true">
                <use href="icons/ui.svg#Cancel01Icon"></use>
              </svg>
            </button>
          </div>
          <div class="metadata">
            <span id="ticket-kind"></span
            ><span id="ticket-state" class="badge"></span
            ><button id="open-file" class="text-button">
              <span>Open file</span>
              <svg class="icon" aria-hidden="true">
                <use href="icons/ui.svg#ArrowUpRight01Icon"></use>
              </svg>
            </button>
          </div>
        </header>
        <div id="reading" class="reading">
          <div id="body" class="prose"></div>
          <section id="blockers-section" hidden>
            <h2>Blockers</h2>
            <div id="blockers"></div>
          </section>
          <section id="assets-section" hidden>
            <h2>Assets</h2>
            <div id="assets"></div>
          </section>
          <section id="frontier-section" hidden>
            <h2>Ready to explore</h2>
            <div id="frontier"></div>
          </section>
          <div id="warnings" class="warnings"></div>
        </div>
        <form id="launcher" hidden>
          <div id="setup" class="setup"></div>
          <label class="note-field" for="note">
            <span class="field-label"
              >Additional direction <span class="optional">Optional</span></span
            >
            <textarea
              id="note"
              rows="2"
              placeholder="Add context for the agent…"
            ></textarea>
          </label>
          <div class="launch-options">
            <label for="agents"
              >Agent
              <span class="select-control">
                <select id="agents" required></select>
                <svg class="icon" aria-hidden="true">
                  <use href="icons/ui.svg#ArrowDown01Icon"></use>
                </svg>
              </span>
            </label>
            <label for="methods"
              >Method
              <span class="select-control">
                <select id="methods">
                  <option value="">Automatic</option>
                </select>
                <svg class="icon" aria-hidden="true">
                  <use href="icons/ui.svg#ArrowDown01Icon"></use>
                </svg>
              </span>
            </label>
          </div>
          <div class="launch-actions">
            <div class="setup-actions">
              <button type="button" id="agent-setup" class="text-button">
                Agents…
              </button>
              <button type="button" id="skill-setup" class="text-button">
                Skill sources…
              </button>
            </div>
            <button id="preview" type="submit" class="primary">
              <span>Review & launch</span>
              <svg class="icon" aria-hidden="true">
                <use href="icons/ui.svg#ArrowUpRight01Icon"></use>
              </svg>
            </button>
          </div>
        </form>
        <footer id="claim" hidden>
          <p id="claim-label"></p>
        </footer>
      </aside>
      <footer class="map-footer" hidden>
        <button
          id="fit"
          class="icon-button"
          title="Fit map (F)"
          aria-label="Fit map"
        >
          <svg class="icon" aria-hidden="true">
            <use href="icons/ui.svg#FullScreenIcon"></use>
          </svg>
        </button>
        <div id="legend" aria-label="Star status legend">
          <span data-state="Ready">Ready</span
          ><span data-state="Claimed">Claimed</span
          ><span data-state="Resolved">Resolved</span
          ><span data-state="Blocked">Blocked</span
          ><span data-state="Out of scope">Ruled out</span>
        </div>
        <span id="map-count"></span>
      </footer>
      <dialog id="prompt-dialog" aria-labelledby="prompt-title">
        <header>
          <div>
            <h2 id="prompt-title">Ready to launch?</h2>
            <p id="prompt-sources"></p>
          </div>
          <button
            id="close-preview"
            class="icon-button text-button"
            aria-label="Close prompt preview"
          >
            <svg class="icon" aria-hidden="true">
              <use href="icons/ui.svg#Cancel01Icon"></use>
            </svg>
          </button>
        </header>
        <pre id="prompt-text" tabindex="0"></pre>
        <footer>
          <span id="preview-status" role="status"></span
          ><button id="cancel-preview">Cancel</button
          ><button id="launch" class="primary">
            <span>Launch agent</span>
            <svg class="icon" aria-hidden="true">
              <use href="icons/ui.svg#ArrowUpRight01Icon"></use>
            </svg>
          </button>
        </footer>
      </dialog>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
